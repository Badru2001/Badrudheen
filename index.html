<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Swipe App</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
body {
    margin: 0;
    padding: 10px;
    background: #fff;
    font-family: Arial;
}

/* FRAME */
.frame {
    height: calc(100vh - 20px);
    border: 1.5px solid black;
    border-radius: 38px;
    overflow: hidden;
    position: relative;
}

/* SCREENS */
.screen {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    display: none;
}

.screen.active {
    display: block;
}

/* MAIN */
.main {
    background: white;
}

/* PROFILE */
.profile {
    background: #e5e5e5;
    padding: 20px;
    overflow-y: auto;
}

/* HEADER */
.profile-header {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
}

.profile img {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 1.5px solid black;
    margin-right: 10px;
}

/* ROW */
.row {
    background: white;
    padding: 12px;
    border-radius: 15px;
    border: 1px solid black;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    cursor: pointer;
}

/* ICON */
.icon {
    margin-right: 10px;
    font-size: 18px;
}

/* DETAILS */
.details {
    padding: 20px;
}

/* INPUT */
input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid black;
    margin-top: 10px;
}

/* SAVE BUTTON */
button {
    margin-top: 15px;
    padding: 10px;
    width: 100%;
    border-radius: 10px;
    border: none;
    background: black;
    color: white;
}

/* BOTTOM NAV */
.nav {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 55px;
    border-top: 1px solid black;
    display: flex;
    background: white;
}

.nav div {
    flex: 1;
    text-align: center;
    line-height: 55px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="frame">

<!-- MAIN -->
<div class="screen main active" id="main"></div>

<!-- PROFILE -->
<div class="screen profile" id="profile">

<div class="profile-header">
<img src="https://via.placeholder.com/150">
<h3>Badrudheen</h3>
</div>

<div id="list"></div>

</div>

<!-- DETAILS -->
<div class="screen details" id="details">
<h3 id="title"></h3>
<input id="input" placeholder="Enter details">
<button onclick="saveData()">Save</button>
</div>

<!-- BOTTOM NAV -->
<div class="nav">
<div onclick="openScreen('main')">🏠</div>
<div onclick="openScreen('profile')">👤</div>
</div>

</div>

<script>
const items = [
"Resident ID",
"Vehicle Registration",
"Driving License",
"Passport",
"Pan Card",
"Aadhar Card",
"ANB Bank",
"NRI",
"Canara Bank",
"State Bank"
];

const icons = ["🪪","🚗","🪪","📘","💳","🆔","🏦","🌍","🏦","🏦"];

const list = document.getElementById("list");

items.forEach((item,i)=>{
    const div = document.createElement("div");
    div.className = "row";
    div.innerHTML = `<span class="icon">${icons[i]}</span>${item}`;
    div.onclick = ()=>openDetails(item);
    list.appendChild(div);
});

function openScreen(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

let currentKey = "";

function openDetails(name){
    currentKey = name;
    document.getElementById("title").innerText = name;
    document.getElementById("input").value = localStorage.getItem(name) || "";
    openScreen("details");
}

function saveData(){
    const value = document.getElementById("input").value;
    localStorage.setItem(currentKey, value);
    alert("Saved!");
}
</script>

</body>
</html>
