<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Swipe App</title>

<!-- ✅ APP ICON -->
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<!-- ✅ MOBILE APP SETTINGS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Swipe App">

<style>
body {
    margin: 0;
    padding: 10px;
    background: #fff;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* OUTER FRAME */
.frame {
    width: 100%;
    height: calc(100vh - 20px);
    border: 1.5px solid black;
    border-radius: 38px;
    overflow: hidden;
    position: relative;
}

/* SLIDER */
.slider {
    display: flex;
    width: 200%;
    height: 100%;
    transition: transform 0.3s ease;
}

/* SCREENS */
.screen {
    width: 100%;
    height: 100%;
    flex-shrink: 0;
}

/* MAIN */
.main {
    background: white;
}

/* PROFILE */
.profile {
    background: #e5e5e5;
    padding: 20px;
    box-sizing: border-box;
}

/* PROFILE HEADER */
.profile-header {
    display: flex;
    align-items: center;
}

/* IMAGE */
.profile img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 1.5px solid black;
    object-fit: cover;
    margin-right: 15px;
}

/* NAME */
.profile h2 {
    font-size: 16px;
    font-weight: normal;
    margin: 0;
}
</style>
</head>

<body>

<div class="frame" id="app">
    <div class="slider" id="slider">

        <!-- MAIN -->
        <div class="screen main"></div>

        <!-- PROFILE -->
        <div class="screen profile">
            <div class="profile-header">
                <img src="https://via.placeholder.com/150">
                <h2>Badrudheen</h2>
            </div>
        </div>

    </div>
</div>

<script>
let startX = 0;
let endX = 0;

const app = document.getElementById("app");
const slider = document.getElementById("slider");

app.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

app.addEventListener("touchend", e => {
    endX = e.changedTouches[0].clientX;

    if (startX - endX > 50) {
        slider.style.transform = "translateX(-100%)";
    }

    if (endX - startX > 50) {
        slider.style.transform = "translateX(0)";
    }
});
</script>

</body>
</html>
