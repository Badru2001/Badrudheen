<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swipe App</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
body {
    margin: 0;
    padding: 10px;
    font-family: Arial;
}

/* FRAME */
.frame {
    height: calc(100vh - 20px);
    border: 1.5px solid black;
    border-radius: 38px;
    overflow: hidden;
    position: relative;
}

/* SCREEN */
.screen {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
}

.screen.active {
    display: block;
}

/* PROFILE */
.profile {
    background: #e5e5e5;
    padding: 20px;
    overflow-y: auto;
}

/* ROW */
.row {
    background: white;
    padding: 12px;
    border-radius: 15px;
    border: 1px solid black;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    cursor: pointer;
}

.row img {
    width: 25px;
    margin-right: 10px;
}

/* DETAILS */
.details {
    padding: 20px;
}

.preview {
    width: 100%;
    height: 200px;
    margin-top: 10px;
    border-radius: 10px;
}

/* BUTTON */
button {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: black;
    color: white;
}
</style>
</head>

<body>

<div class="frame">

<!-- PROFILE -->
<div class="screen profile active" id="profile">
<div id="list"></div>
</div>

<!-- DETAILS -->
<div class="screen details" id="details">
<h3 id="title"></h3>

<input type="file" id="fileInput" accept="image/*,application/pdf">

<!-- PREVIEW -->
<img id="imgPreview" class="preview" style="display:none;">
<iframe id="pdfPreview" class="preview" style="display:none;"></iframe>

<button onclick="saveFile()">Save</button>
<button onclick="downloadFile()">Download</button>
<button onclick="shareFile()">Share</button>

</div>

</div>

<script>
const items = [
"Resident ID","Vehicle Registration","Driving License","Passport",
"Pan Card","Aadhar Card","ANB Bank","NRI","Canara Bank","State Bank"
];

const images = [
"resident.png","vehicle.png","license.png","passport.png",
"pan.png","aadhar.png","anb.png","nri.png","canara.png","sbi.png"
];

const list = document.getElementById("list");

items.forEach((item,i)=>{
    const div = document.createElement("div");
    div.className = "row";
    div.innerHTML = `<img src="${images[i]}">${item}`;
    div.onclick = ()=>openDetails(item);
    list.appendChild(div);
});

function openScreen(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

let currentKey = "";
let currentFile = "";

function openDetails(name){
    currentKey = name;
    document.getElementById("title").innerText = name;

    const saved = localStorage.getItem(name);
    if(saved){
        showPreview(saved);
        currentFile = saved;
    }

    openScreen("details");
}

/* FILE INPUT */
document.getElementById("fileInput").addEventListener("change", function(){
    const file = this.files[0];
    const reader = new FileReader();

    reader.onload = function(e){
        currentFile = e.target.result;
        showPreview(currentFile);
    };

    if(file){
        reader.readAsDataURL(file);
    }
});

/* SHOW PREVIEW */
function showPreview(data){
    if(data.includes("application/pdf")){
        document.getElementById("pdfPreview").style.display = "block";
        document.getElementById("imgPreview").style.display = "none";
        document.getElementById("pdfPreview").src = data;
    } else {
        document.getElementById("imgPreview").style.display = "block";
        document.getElementById("pdfPreview").style.display = "none";
        document.getElementById("imgPreview").src = data;
    }
}

/* SAVE */
function saveFile(){
    if(currentFile){
        localStorage.setItem(currentKey, currentFile);
        alert("Saved!");
    }
}

/* DOWNLOAD */
function downloadFile(){
    if(!currentFile) return;

    const a = document.createElement("a");
    a.href = currentFile;
    a.download = currentKey;
    a.click();
}

/* SHARE */
function shareFile(){
    if(navigator.share){
        navigator.share({
            title: currentKey,
            text: "My Document",
            url: currentFile
        });
    } else {
        alert("Sharing not supported on this device");
    }
}
</script>

</body>
</html>
