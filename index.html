<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Docs</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f5f5f5;
}

/* OUTER FRAME */
.container {
  max-width: 420px;
  margin: auto;
  border: 2px solid black;
  border-radius: 25px;
  overflow: hidden;
  background: white;
}

/* PROFILE */
.profile {
  padding: 15px;
  display: flex;
  align-items: center;
}

.profile img {
  width: 70px;
  height: 70px;
  border-radius: 50%;
}

/* ROW LIST */
.list {
  padding: 10px;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #eee;
  margin-bottom: 10px;
  padding: 12px;
  border-radius: 20px;
  cursor: pointer;
}

.row img {
  width: 28px;
}

/* DETAIL PAGE */
.page {
  display: none;
  padding: 15px;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.small-icon {
  width: 22px;
  cursor: pointer;
}

.preview {
  margin-top: 20px;
  text-align: center;
}

.preview img {
  width: 100%;
  border-radius: 10px;
}

/* SHARE ICON */
.share {
  position: fixed;
  bottom: 80px;
  right: 20px;
}

.share img {
  width: 30px;
  cursor: pointer;
}

/* BOTTOM NAV */
.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  max-width: 420px;
  display: flex;
  justify-content: space-around;
  background: white;
  border-top: 1px solid #ccc;
  padding: 8px 0;
}

.nav img {
  width: 26px;
}
</style>
</head>

<body>

<div class="container">

  <!-- PROFILE -->
  <div class="profile">
    <img src="profile.png">
  </div>

  <!-- LIST -->
  <div class="list" id="list"></div>

  <!-- DETAIL PAGE -->
  <div class="page" id="page">
    
    <div class="top-bar">
      <span onclick="back()">⬅</span>
      
      <!-- SMALL UPLOAD ICON -->
      <label>
        <img src="upload.png" class="small-icon">
        <input type="file" id="fileInput" hidden 
        accept="image/*,.pdf" onchange="uploadFile(event)">
      </label>
    </div>

    <div class="preview" id="preview"></div>

  </div>

</div>

<!-- SHARE ICON -->
<div class="share">
  <img src="share.png" onclick="shareFile()">
</div>

<!-- BOTTOM NAV -->
<div class="nav">
  <img src="home.png">
  <img src="search.png">
  <img src="add.png">
  <img src="reel.png">
  <img src="user.png">
</div>

<script>
const items = [
"Resident ID",
"Vehicle Registration",
"Driving License",
"Passport",
"Pan Card",
"Aadhar Card",
"ANB Bank",
"NRI",
"Canara Bank",
"State Bank"
];

const list = document.getElementById("list");
const page = document.getElementById("page");
let currentItem = "";

// CREATE ROWS
items.forEach(name => {
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML = `
    <span>${name}</span>
    <img src="doc.png">
  `;
  div.onclick = () => openPage(name);
  list.appendChild(div);
});

// OPEN PAGE
function openPage(name){
  currentItem = name;
  list.style.display = "none";
  page.style.display = "block";
  loadFile();
}

// BACK
function back(){
  page.style.display = "none";
  list.style.display = "block";
}

// AUTO UPLOAD
function uploadFile(e){
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(){
    localStorage.setItem(currentItem, reader.result);
    showFile(reader.result);
  };

  reader.readAsDataURL(file);
}

// SHOW FILE
function showFile(data){
  const preview = document.getElementById("preview");

  if(data.includes("pdf")){
    preview.innerHTML = `<iframe src="${data}" width="100%" height="400px"></iframe>`;
  } else {
    preview.innerHTML = `<img src="${data}">`;
  }
}

// LOAD SAVED
function loadFile(){
  const data = localStorage.getItem(currentItem);
  if(data){
    showFile(data);
  } else {
    document.getElementById("preview").innerHTML = "";
  }
}

// SHARE ONLY ICON
function shareFile(){
  const data = localStorage.getItem(currentItem);
  if(data){
    navigator.share({
      title: currentItem,
      url: data
    });
  } else {
    alert("No file");
  }
}
</script>

</body>
</html>
